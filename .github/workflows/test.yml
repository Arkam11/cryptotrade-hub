name: CI — Test & Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cryptouser
          POSTGRES_PASSWORD: cryptopass
          POSTGRES_DB: cryptotrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ruff pytest pytest-cov pytest-asyncio httpx aiosqlite \
            fastapi uvicorn sqlalchemy asyncpg alembic pydantic pydantic-settings \
            "python-jose[cryptography]" "passlib[bcrypt]" "bcrypt==4.0.1" \
            python-multipart tenacity redis

      - name: Lint with ruff
        run: ruff check services/

      - name: Run portfolio tests
        working-directory: services/portfolio
        run: pytest tests/ --cov=app --cov-report=xml -v
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: cryptouser
          POSTGRES_PASSWORD: cryptopass
          POSTGRES_DB: cryptotrade_test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./services/portfolio/coverage.xml
